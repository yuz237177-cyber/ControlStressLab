[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlstresslab"
version = "1.0.0"
description = "Reproducible SISO controller stress tests with explicit evidence boundaries"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
reference = ["scipy>=1.9.1", "control>=0.10.2"]
build = ["pyinstaller>=6.22,<7"]
analysis = ["numpy>=1.26", "scipy>=1.14"]
gui = ["PySide6-Essentials>=6.8", "matplotlib>=3.8", "numpy>=1.26", "scipy>=1.14"]

[project.scripts]
controlstresslab = "controlstresslab.cli:main"
controlstresslab-uncertainty = "controlstresslab.uncertainty:main"
controlstresslab-stress-grid = "controlstresslab.stress_grid:main"
controlstresslab-coverage = "controlstresslab.coverage:main"
controlstresslab-benchmark = "controlstresslab.benchmark:main"
controlstresslab-experiment = "controlstresslab.experiment:main"
controlstresslab-gui = "controlstresslab.gui:main"
controlstresslab-model-preview = "controlstresslab.model_analysis:main"
controlstresslab-frequency = "controlstresslab.frequency:main"
controlstresslab-robustness = "controlstresslab.robustness:main"
controlstresslab-compare = "controlstresslab.comparison:main"
controlstresslab-tune = "controlstresslab.tuning:main"
controlstresslab-tune-validate = "controlstresslab.tuning_validation:main"

[tool.setuptools.packages.find]
where = ["src"]
