[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlstresslab"
version = "0.4.0"
description = "Reproducible SISO controller stress tests with explicit evidence boundaries"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
reference = ["scipy>=1.9.1"]
gui = ["PySide6-Essentials>=6.8", "matplotlib>=3.8"]

[project.scripts]
controlstresslab = "controlstresslab.cli:main"
controlstresslab-uncertainty = "controlstresslab.uncertainty:main"
controlstresslab-stress-grid = "controlstresslab.stress_grid:main"
controlstresslab-coverage = "controlstresslab.coverage:main"
controlstresslab-benchmark = "controlstresslab.benchmark:main"
controlstresslab-experiment = "controlstresslab.experiment:main"
controlstresslab-gui = "controlstresslab.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
