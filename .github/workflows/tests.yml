name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python run_demo.py --output outputs/ci-demo
      - run: python -m pip install --no-deps .
      - run: controlstresslab --output installed-ci-demo
        working-directory: ${{ runner.temp }}
      - run: controlstresslab-uncertainty --inertia-factors 1,1.5 --friction-factors 1,1.5 --output installed-uncertainty
        working-directory: ${{ runner.temp }}
      - run: controlstresslab-stress-grid --loads "0,0.15" --delays "0,0.1" --output installed-stress-grid
        working-directory: ${{ runner.temp }}
      - run: controlstresslab-coverage --models first_order,mass_spring_damper --scenarios reference_sine,disturbance_prbs --output installed-coverage
        working-directory: ${{ runner.temp }}
      - name: Installed budgeted benchmark outside source directory
        run: controlstresslab-benchmark --config "${{ github.workspace }}/configs/benchmark-ci.json" --output installed-benchmark
        working-directory: ${{ runner.temp }}
      - run: python scripts/build_readme_preview.py
      - run: python -m pip install ".[gui]"
        if: matrix.python == '3.12'
      - name: Desktop interactions and real background worker
        run: python -m unittest discover -s tests -p test_gui.py -v
        if: matrix.python == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_chart_gallery.py --output outputs/ci-gallery
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: controlstresslab-uncertainty --inertia-factors 1,1.5 --friction-factors 1,1.5 --output outputs/ci-uncertainty-plots --plots
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: controlstresslab-stress-grid --loads "0,0.15" --delays "0,0.1" --output outputs/ci-stress-plots --plots
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: python -m pip install ".[reference]"
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: python scripts/reference_checks.py --output outputs/ci-reference --plots
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: controlstresslab-coverage --models first_order,mass_spring_damper --scenarios reference_sine,disturbance_prbs,measurement_noise_delay --output outputs/ci-coverage --plots
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: python scripts/check_coverage_reference.py --suite outputs/ci-coverage --output outputs/ci-coverage-reference.json
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: controlstresslab-benchmark --config configs/benchmark-ci.json --output outputs/ci-benchmark --plots
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: python scripts/check_coverage_reference.py --suite outputs/ci-benchmark --output outputs/ci-benchmark-reference.json
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - run: python scripts/check_benchmark_evidence.py --suite outputs/ci-benchmark --output outputs/ci-benchmark-evidence.json
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
